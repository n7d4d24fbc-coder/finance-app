<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мои Финансы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style id="core-styles">
    body { background: var(--tg-theme-bg-color, #0f0f14); color: var(--tg-theme-text-color, #fff); font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 90vh; margin: 0; }
    .loader { text-align: center; font-size: 14px; opacity: 0.7; }
  </style>
</head>
<body>
  <div id="app-root">
    <div class="loader" id="boot-msg">Загрузка кошелька...</div>
  </div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzyiUm7L1Y-sijmuBq8ExJ6PRMxkjqWSWNNsRhF5Il0gEh7AWYkWzyq20QW6bXlqjYq/exec';
  
  const tg = window.Telegram.WebApp;
  tg.expand();
  tg.ready();

  const userId = tg.initDataUnsafe?.user?.id || '';

  window.coreRequest = async function(payload) {
    payload.userId = userId;
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return await res.json();
  };

  async function bootApp() {
    try {
      const res = await window.coreRequest({ action: 'boot' });
      if (!res.ok) {
        document.getElementById('boot-msg').innerText = res.error + (userId ? ` (ID: ${userId})` : '');
        return;
      }
      if (res.core) {
        document.getElementById('core-styles').innerHTML = res.core.css;
        document.getElementById('app-root').innerHTML = res.core.html;
        const scriptFn = new Function(res.core.clientJs);
        scriptFn();
        if (window.app && window.app.init) {
          window.app.init(res.data);
        }
      }
    } catch (e) {
      document.getElementById('boot-msg').innerText = 'Ошибка загрузки: ' + e.message;
    }
  }

  bootApp();
</script>
</body>
</html>
